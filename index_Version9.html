<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="玥珩的雷諾曼三選項牌卡占卜" />
  <title>玥珩｜雷諾曼三選項占卜</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #191722;
      --panel: #262331;
      --panel-light: #332f40;
      --text: #f8f2e9;
      --muted: #d0c8d3;
      --accent: #d9bd89;
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at top, #494054 0%, transparent 55%),
        var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
    }

    main {
      width: min(1000px, 100%);
      margin: 0 auto;
    }

    .profile,
    .panel {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(38, 35, 49, 0.94);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.2);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      padding: 22px;
    }

    .profile-avatar {
      width: 112px;
      height: 112px;
      flex: 0 0 112px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      background: var(--panel-light);
      object-fit: cover;
    }

    .profile-label {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .profile-info h1 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 1.65rem;
    }

    .profile-info p:last-child {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .intro {
      margin: 0 0 24px;
      text-align: center;
    }

    .intro h2 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
    }

    .intro p,
    .note {
      color: var(--muted);
      line-height: 1.7;
    }

    .panel {
      padding: 24px;
    }

    label {
      display: block;
      font-weight: 650;
    }

    .question-label {
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #191824;
      color: var(--text);
      font: inherit;
    }

    input::placeholder {
      color: #aaa4b8;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .option-inputs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .option-inputs label {
      display: grid;
      gap: 8px;
    }

    button {
      min-height: 48px;
      margin-top: 18px;
      padding: 10px 20px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #211d18;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .question-result {
      margin: 20px 0 0;
      color: var(--muted);
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .option-block {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.035);
    }

    .option-block h3 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 1.35rem;
      overflow-wrap: anywhere;
    }

    .option-summary {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .card {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(160deg, var(--panel-light), #211f2e);
    }

    .position {
      min-height: 2.8em;
      margin-bottom: 12px;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .card-symbol {
      margin-bottom: 8px;
      font-size: 2rem;
    }

    .card h4 {
      margin: 0 0 10px;
      font-size: 1.2rem;
    }

    .card p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .note {
      margin: 18px 4px 0;
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px 12px;
      }

      .profile {
        gap: 14px;
        padding: 16px;
      }

      .profile-avatar {
        width: 82px;
        height: 82px;
        flex-basis: 82px;
      }

      .profile-info h1 {
        font-size: 1.35rem;
      }

      .panel {
        padding: 18px;
      }

      .option-inputs,
      .cards {
        grid-template-columns: 1fr;
      }

      .position {
        min-height: 0;
      }
    }

    @media (max-width: 380px) {
      .profile {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="profile" aria-label="關於玥珩">
      <img
        class="profile-avatar"
        src="avatar.jpg"
        alt="玥珩的頭貼"
      />
      <div class="profile-info">
        <p class="profile-label">ABOUT ME</p>
        <h1>我是玥珩</h1>
        <p>我是玥珩，用溫潤、療癒的靈性光芒為混亂的系統找回秩序</p>
      </div>
    </section>

    <header class="intro">
      <h2>雷諾曼｜三選項占卜</h2>
      <p>想一個你在意的問題，為三個選項各抽三張牌，探索不同方向。</p>
    </header>

    <section class="panel" aria-label="雷諾曼三選項抽牌">
      <label class="question-label" for="question">你的問題</label>
      <input
        id="question"
        type="text"
        maxlength="200"
        placeholder="例如：我該如何規劃接下來的工作？"
      />

      <div class="option-inputs">
        <label for="option1">
          選項一
          <input id="option1" type="text" maxlength="60" placeholder="例如：接受新的工作機會" />
        </label>
        <label for="option2">
          選項二
          <input id="option2" type="text" maxlength="60" placeholder="例如：留在目前的工作" />
        </label>
        <label for="option3">
          選項三
          <input id="option3" type="text" maxlength="60" placeholder="例如：繼續尋找其他機會" />
        </label>
      </div>

      <button id="drawButton" type="button">為三個選項抽牌</button>
      <p id="questionResult" class="question-result" aria-live="polite">
        輸入問題與選項，準備好後開始抽牌。
      </p>
      <div id="results"></div>
    </section>

    <p class="note">
      每次會從 36 張牌中抽出 9 張不重複的牌，每個選項各 3 張。
      牌面解讀適合作為自我探索與整理想法的參考。
    </p>
  </main>

  <script>
    const deck = [
      { number: 1, name: "騎士", symbol: "🐎", meaning: "消息、來訪、行動與新的進展。", advice: "留意新消息，也可以主動採取行動。" },
      { number: 2, name: "四葉草", symbol: "🍀", meaning: "小小的幸運、短暫機會與輕鬆感。", advice: "把握眼前的小機會，但別把短暫好運當成長期保證。" },
      { number: 3, name: "船", symbol: "⛵", meaning: "旅行、距離、探索與逐漸展開的變化。", advice: "保持開放，事情可能需要時間或跨出熟悉範圍。" },
      { number: 4, name: "房子", symbol: "🏠", meaning: "家庭、住處、安全感與穩固的基礎。", advice: "確認你的生活與計畫是否有穩定支撐。" },
      { number: 5, name: "樹", symbol: "🌳", meaning: "成長、健康、根基與需要時間的發展。", advice: "耐心培養，留意身心狀態與長期累積。" },
      { number: 6, name: "雲", symbol: "☁️", meaning: "困惑、資訊不清、猶豫與暫時的迷霧。", advice: "先釐清事實，避免在不確定時急著下結論。" },
      { number: 7, name: "蛇", symbol: "🐍", meaning: "複雜情況、迂迴策略或需要謹慎的人際關係。", advice: "多看一層，確認資訊與界線。" },
      { number: 8, name: "棺材", symbol: "⚰️", meaning: "結束、停頓、告一段落與轉化的空間。", advice: "接受某個階段可能已經完成，為新安排留出位置。" },
      { number: 9, name: "花束", symbol: "💐", meaning: "邀請、欣賞、愉快的驚喜與友善互動。", advice: "接受善意，也可以真誠表達感謝。" },
      { number: 10, name: "鐮刀", symbol: "🌾", meaning: "迅速決定、突然變化與需要注意的風險。", advice: "做重要決定前先停一下，留意可能後果。" },
      { number: 11, name: "鞭子", symbol: "〰️", meaning: "爭論、反覆、壓力與持續重複的模式。", advice: "辨認反覆發生的問題，避免衝突升高。" },
      { number: 12, name: "鳥", symbol: "🐦", meaning: "交談、消息往來、短暫忙亂或緊張感。", advice: "把話說清楚，也留時間整理思緒。" },
      { number: 13, name: "小孩", symbol: "🧒", meaning: "新開始、學習、好奇心與尚在萌芽的事物。", advice: "從小步開始，保持彈性，不必一開始就完美。" },
      { number: 14, name: "狐狸", symbol: "🦊", meaning: "工作、機敏、策略與需要核實的情況。", advice: "仔細確認細節，尤其是工作安排與承諾。" },
      { number: 15, name: "熊", symbol: "🐻", meaning: "力量、保護、資源、權威或強烈的影響力。", advice: "善用手上的資源，也注意權力與控制的平衡。" },
      { number: 16, name: "星星", symbol: "⭐", meaning: "希望、靈感、方向感與長遠願景。", advice: "看清目標，持續前進，也可尋求啟發。" },
      { number: 17, name: "鸛鳥", symbol: "🕊️", meaning: "改變、搬遷、更新與逐步改善。", advice: "為變化預留空間，調整做法可能帶來進展。" },
      { number: 18, name: "狗", symbol: "🐕", meaning: "友誼、忠誠、支持與值得信賴的夥伴。", advice: "珍惜可靠的支持，也用行動維護信任。" },
      { number: 19, name: "塔", symbol: "🏛️", meaning: "機構、規則、界線、獨立與長期結構。", advice: "看清制度或界線如何影響你，必要時保持距離。" },
      { number: 20, name: "花園", symbol: "🌷", meaning: "社交場合、社群、公開活動與人際網絡。", advice: "適度交流或參與社群，可能帶來幫助。" },
      { number: 21, name: "山", symbol: "⛰️", meaning: "阻礙、延遲、距離感與需要克服的難題。", advice: "拆分問題，一步一步處理，不要低估阻力。" },
      { number: 22, name: "岔路", symbol: "↔️", meaning: "選擇、分岔、不同可能與需要決定的方向。", advice: "比較選項與代價，選擇符合優先順序的道路。" },
      { number: 23, name: "老鼠", symbol: "🐭", meaning: "消耗、損失、煩惱與逐漸累積的小問題。", advice: "及早處理正在消耗時間、金錢或心力的事情。" },
      { number: 24, name: "心", symbol: "❤️", meaning: "感情、喜愛、熱情與真正在意的事物。", advice: "留意自己的感受，也清楚表達心意。" },
      { number: 25, name: "戒指", symbol: "💍", meaning: "承諾、契約、合作與循環往復的關係。", advice: "確認彼此對承諾的理解一致，留意合作條件。" },
      { number: 26, name: "書", symbol: "📖", meaning: "知識、學習、秘密與尚未揭露的資訊。", advice: "繼續蒐集資料，目前可能還有資訊未明。" },
      { number: 27, name: "信", symbol: "✉️", meaning: "訊息、文件、通知與書面往來。", advice: "檢查訊息與文件細節，重要事項留下紀錄。" },
      { number: 28, name: "男士", symbol: "👤", meaning: "重要的男性人物，或問題中具有陽性能量的一方。", advice: "留意這位人物的立場，也可依牌組慣例代指問卜者。" },
      { number: 29, name: "女士", symbol: "👤", meaning: "重要的女性人物，或問題中具有陰性能量的一方。", advice: "留意這位人物的立場，也可依牌組慣例代指問卜者。" },
      { number: 30, name: "百合", symbol: "🌸", meaning: "成熟、平和、經驗、家庭和諧或親密關係。", advice: "用成熟與耐心處理事情，讓溝通回到平靜。" },
      { number: 31, name: "太陽", symbol: "☀️", meaning: "活力、成功、清晰、信心與正向成果。", advice: "看見已有的優勢，保持行動力並分享成果。" },
      { number: 32, name: "月亮", symbol: "🌙", meaning: "情緒、直覺、想像力、聲譽與被認可的需求。", advice: "重視感受與創意，也分辨直覺和一時情緒。" },
      { number: 33, name: "鑰匙", symbol: "🗝️", meaning: "關鍵、解答、重要發現與開啟機會。", advice: "留意能讓問題突破的關鍵資訊或行動。" },
      { number: 34, name: "魚", symbol: "🐟", meaning: "金錢、資源、流動、交易與自主性。", advice: "檢視資源如何流動，特別留意財務與交易細節。" },
      { number: 35, name: "錨", symbol: "⚓", meaning: "穩定、持久、工作、安全感與堅持。", advice: "穩定累積有助長期成果，也留意是否過度停滯。" },
      { number: 36, name: "十字架", symbol: "✝️", meaning: "責任、考驗、沉重課題與需要承擔的事情。", advice: "正視壓力，分辨哪些責任值得承擔、哪些需要求助。" }
    ];

    const positions = [
      { name: "起點", prompt: "出發狀態或背景" },
      { name: "發展", prompt: "選擇後可能經歷的過程" },
      { name: "可能趨勢", prompt: "沿著此方向前進的可能發展" }
    ];

    const questionInput = document.getElementById("question");
    const questionResult = document.getElementById("questionResult");
    const resultsContainer = document.getElementById("results");
    const drawButton = document.getElementById("drawButton");

    const optionInputs = [
      document.getElementById("option1"),
      document.getElementById("option2"),
      document.getElementById("option3")
    ];

    function drawNineCards() {
      const shuffled = [...deck];

      // Fisher–Yates 洗牌，抽出的九張牌不會重複。
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      return shuffled.slice(0, 9);
    }

    function createCard(card, position) {
      const article = document.createElement("article");
      article.className = "card";

      const positionLabel = document.createElement("div");
      positionLabel.className = "position";
      positionLabel.textContent = `${position.name}｜${position.prompt}`;

      const symbol = document.createElement("div");
      symbol.className = "card-symbol";
      symbol.setAttribute("aria-hidden", "true");
      symbol.textContent = card.symbol;

      const title = document.createElement("h4");
      title.textContent = `${String(card.number).padStart(2, "0")}．${card.name}`;

      const meaning = document.createElement("p");
      meaning.textContent = card.meaning;

      const advice = document.createElement("p");
      advice.textContent = `提醒：${card.advice}`;

      article.append(positionLabel, symbol, title, meaning, advice);
      return article;
    }

    function createOptionSection(optionName, cards) {
      const section = document.createElement("section");
      section.className = "option-block";

      const heading = document.createElement("h3");
      heading.textContent = optionName;

      const summary = document.createElement("p");
      summary.className = "option-summary";
      summary.textContent =
        `起點「${cards[0].name}」：${cards[0].meaning} ` +
        `發展「${cards[1].name}」：${cards[1].meaning} ` +
        `可能趨勢「${cards[2].name}」：${cards[2].meaning}`;

      const cardsGrid = document.createElement("div");
      cardsGrid.className = "cards";

      cards.forEach((card, index) => {
        cardsGrid.appendChild(createCard(card, positions[index]));
      });

      section.append(heading, summary, cardsGrid);
      return section;
    }

    drawButton.addEventListener("click", () => {
      const question = questionInput.value.trim();
      const optionNames = optionInputs.map((input, index) => {
        return input.value.trim() || `選項 ${index + 1}`;
      });

      const drawnCards = drawNineCards();

      questionResult.textContent = question
        ? `你的問題：「${question}」以下是三個選項的牌面參考。`
        : "你沒有輸入問題；以下牌面可作為一般性的自我探索參考。";

      resultsContainer.replaceChildren();

      optionNames.forEach((optionName, index) => {
        const optionCards = drawnCards.slice(index * 3, index * 3 + 3);
        resultsContainer.appendChild(
          createOptionSection(optionName, optionCards)
        );
      });
    });
  </script>
</body>
</html>
